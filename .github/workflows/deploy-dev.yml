name: Deploy Dev

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Dev to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      VERCEL_DEV_ALIAS: a-guy-admin-git-dev-aguy.vercel.app
      VERCEL_ACCESS_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v4

      - name: Verify deployment credentials
        shell: bash
        run: |
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_ACCESS_TOKEN"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install Vercel CLI
        run: npm install --global vercel@54.10.2

      - name: Pull Preview configuration
        run: vercel pull --yes --environment=preview --token="$VERCEL_ACCESS_TOKEN"

      - name: Build Preview
        run: vercel build --token="$VERCEL_ACCESS_TOKEN"

      - name: Deploy Preview
        id: deploy
        shell: bash
        run: |
          deployment_url="$(
            vercel deploy --prebuilt --token="$VERCEL_ACCESS_TOKEN" \
              -m githubDeployment=1 \
              -m githubCommitRef=${{ github.ref_name }} \
              -m githubCommitSha=${{ github.sha }} \
              -m githubCommitOrg=${{ github.repository_owner }} \
              -m githubCommitRepo=${{ github.event.repository.name }}
          )"
          vercel alias set "$deployment_url" "$VERCEL_DEV_ALIAS" \
            --token="$VERCEL_ACCESS_TOKEN" \
            --scope="$VERCEL_ORG_ID"
          echo "url=https://$VERCEL_DEV_ALIAS" >> "$GITHUB_OUTPUT"

      - name: Publish deployment address
        run: |
          echo "Dev deployment: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
